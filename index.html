<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply a theme picked in settings before first paint (see src/lib/theme.ts).
      try { document.querySelector('meta[name="color-scheme"]').content = localStorage.getItem("md-editor:color-scheme") || "light dark"; } catch {}
    </script>
    <meta name="theme-color" content="#f5f5f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1d1e22" media="(prefers-color-scheme: dark)" />
    <title>Hugo Editor</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <md-app></md-app>
  </body>
</html>
